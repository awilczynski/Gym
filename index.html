<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dziennik" />
  <title>Dziennik Treningowy</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1 id="header-title">Dziennik Treningowy</h1>
    <div class="header-actions">
      <button id="btn-export" class="icon-btn" title="Eksportuj dane" aria-label="Eksportuj dane">⬇︎</button>
      <button id="btn-import" class="icon-btn" title="Importuj dane" aria-label="Importuj dane">⬆︎</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden />
    </div>
  </header>

  <main id="app" class="app-main"><!-- views rendered here --></main>

  <nav class="bottom-nav">
    <button class="nav-btn" data-view="start">
      <span class="nav-icon">🏠</span><span class="nav-label">Start</span>
    </button>
    <button class="nav-btn" data-view="session">
      <span class="nav-icon">🏋︎</span><span class="nav-label">Trening</span>
    </button>
    <button class="nav-btn" data-view="progress">
      <span class="nav-icon">📈</span><span class="nav-label">Progresja</span>
    </button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
